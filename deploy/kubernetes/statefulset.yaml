apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: spruce
spec:
  serviceName: spruce-headless
  replicas: 3
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: spruce
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spruce
    spec:
      terminationGracePeriodSeconds: 15
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: spruce
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: spruce
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: spruce
          image: ghcr.io/sprucebus/spruce:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: https
              containerPort: 8080
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SPRUCE_SELF_URL
              value: https://$(POD_NAME).spruce-headless:8080
            - name: SPRUCE_PEERS
              value: https://spruce-0.spruce-headless:8080,https://spruce-1.spruce-headless:8080,https://spruce-2.spruce-headless:8080
            - name: SPRUCE_PEER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: spruce-secrets
                  key: peer-token
            - name: SPRUCE_CLUSTER_ID
              valueFrom:
                secretKeyRef:
                  name: spruce-secrets
                  key: cluster-id
            - name: SPRUCE_CLIENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: spruce-secrets
                  key: client-token
                  optional: true
            - name: SPRUCE_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: spruce-secrets
                  key: admin-token
                  optional: true
            - name: SPRUCE_BASIC_USERNAME
              valueFrom:
                secretKeyRef: {name: spruce-secrets, key: basic-username, optional: true}
            - name: SPRUCE_BASIC_PASSWORD
              valueFrom:
                secretKeyRef: {name: spruce-secrets, key: basic-password, optional: true}
            - name: SPRUCE_TLS_CERT_FILE
              value: /tls/tls.crt
            - name: SPRUCE_TLS_KEY_FILE
              value: /tls/tls.key
            - name: SPRUCE_PEER_CA_FILE
              value: /tls/ca.crt
            - name: SPRUCE_CACHE_BYTES
              value: "67108864"
            - name: SPRUCE_REPLICATION_QUEUE_BYTES
              value: "16777216"
            - name: SPRUCE_ACTION_QUEUE_BYTES
              value: "4194304"
            - name: SPRUCE_MAX_INFLIGHT_BYTES
              value: "33554432"
            - name: SPRUCE_MAX_SUBSCRIBER_INFLIGHT_BYTES
              value: "8388608"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: https
              scheme: HTTPS
            periodSeconds: 2
            timeoutSeconds: 1
          livenessProbe:
            httpGet:
              path: /health/live
              port: https
              scheme: HTTPS
            periodSeconds: 10
            timeoutSeconds: 1
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tls
          secret:
            secretName: spruce-tls
            items:
              - {key: tls.crt, path: tls.crt}
              - {key: tls.key, path: tls.key}
              - {key: ca.crt, path: ca.crt}
