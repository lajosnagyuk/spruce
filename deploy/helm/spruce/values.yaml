replicaCount: 3

image:
  repository: ghcr.io/lajosnagyuk/spruce
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
clusterDomain: cluster.local

gateway:
  enabled: true
  allowInsecureClientTransport: false
  replicaCount: 2
  image:
    repository: nginx
    tag: 1.29-alpine
    digest: sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      memory: 64Mi
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  topologySpreadConstraints: true
  terminationGracePeriodSeconds: 30

service:
  port: 8080

auth:
  existingSecret: ""
  requireExistingSecret: false
  allowMissingExistingSecretForRender: false
  allowAnonymous: false
  peerToken: ""
  previousPeerToken: ""
  clusterID: ""
  clientToken: ""
  previousClientToken: ""
  adminToken: ""
  previousAdminToken: ""

tls:
  enabled: false
  allowInsecureTransport: false
  existingSecret: ""
  caKey: ca.crt

config:
  cacheBytes: "67108864"
  maxMessageBytes: "1048576"
  queueDepth: "4096"
  defaultTTL: 1m
  maxTTL: 24h
  ackDeadline: 15s
  drainDelay: 30s
  replicationQueueBytes: "16777216"
  actionQueueBytes: "4194304"
  maxInflightBytes: "33554432"
  maxSubscriberInflightBytes: "8388608"
  maxAttempts: "5"
  idempotencyEntries: "65536"
  checkpointEntries: "65536"
  maxConcurrentRequests: "1024"
  maxStreams: "4096"
  maxInternalRequests: "256"
  publishAdmissionBytes: "33554432"
  publishAdmissionWait: 100ms
  deliveryLagLimit: 1s
  goMemoryLimit: 176MiB
  memorySafetyMarginBytes: "83886080"

podAnnotations: {}
podLabels: {}
podSecurityContext:
  runAsNonRoot: true
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

resources:
  requests:
    cpu: 25m
    memory: 96Mi
  limits:
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: true
terminationGracePeriodSeconds: 45

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

networkPolicy:
  enabled: true
  dns:
    serviceName: kube-dns
    namespace: kube-system
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: kube-system
    podSelector:
      matchLabels:
        k8s-app: kube-dns
  clientIngress:
    namespaceSelector: {}
    podSelector:
      matchLabels:
        spruce.io/client-access: "true"
  ingressControllerIngress:
    namespaceSelector:
      matchLabels:
        spruce.io/ingress-access: "true"
    podSelector: {}
  adminIngress:
    namespaceSelector:
      matchLabels:
        spruce.io/admin-access: "true"
    podSelector:
      matchLabels:
        spruce.io/admin-access: "true"

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: spruce.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

serviceMonitor:
  enabled: false
  interval: 15s
  namespaceSelector: {}

tests:
  enabled: true
  image:
    repository: curlimages/curl
    tag: 8.16.0
    digest: sha256:463eaf6072688fe96ac64fa623fe73e1dbe25d8ad6c34404a669ad3ce1f104b6
    pullPolicy: IfNotPresent

benchmark:
  enabled: false
  image:
    repository: ""
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  messages: "100000"
  messageBytes: "256"
  producers: "16"
  batchSize: "256"
