{{- if .Values.gateway.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "spruce.fullname" . }}-gateway
  labels:
    {{- include "spruce.labels" . | nindent 4 }}
data:
  nginx.conf: |
    events { worker_connections 4096; }
    http {
      access_log off;
      resolver {{ .Values.networkPolicy.dns.serviceName }}.{{ .Values.networkPolicy.dns.namespace }}.svc.{{ .Values.clusterDomain }} valid=5s ipv6=off;
      {{- if .Values.tls.enabled }}
      proxy_ssl_trusted_certificate /tls/{{ .Values.tls.caKey }};
      proxy_ssl_verify on;
      proxy_ssl_server_name on;
      proxy_ssl_name {{ include "spruce.fullname" . }}-headless.{{ .Release.Namespace }}.svc.{{ .Values.clusterDomain }};
      {{- end }}
      map $arg_topic $stream_key {
        "" "$remote_addr:$remote_port:$connection";
        default "$arg_topic";
      }
      map $uri $publish_key {
        ~^/v1/topics/(?<publish_topic>[A-Za-z0-9._-]+)/(messages|batches)$ $publish_topic;
        default "$uri";
      }
      upstream brokers {
        zone brokers 64k;
        least_conn;
        {{- range $i := until (int .Values.replicaCount) }}
        server {{ include "spruce.fullname" $ }}-{{ $i }}.{{ include "spruce.fullname" $ }}-headless.{{ $.Release.Namespace }}.svc.{{ $.Values.clusterDomain }}:{{ $.Values.service.port }} resolve;
        {{- end }}
        keepalive 64;
      }
      upstream streams {
        zone streams 64k;
        hash $stream_key consistent;
        {{- range $i := until (int .Values.replicaCount) }}
        server {{ include "spruce.fullname" $ }}-{{ $i }}.{{ include "spruce.fullname" $ }}-headless.{{ $.Release.Namespace }}.svc.{{ $.Values.clusterDomain }}:{{ $.Values.service.port }} resolve;
        {{- end }}
      }
      upstream topic_publishes {
        zone topic_publishes 64k;
        hash $publish_key consistent;
        {{- range $i := until (int .Values.replicaCount) }}
        server {{ include "spruce.fullname" $ }}-{{ $i }}.{{ include "spruce.fullname" $ }}-headless.{{ $.Release.Namespace }}.svc.{{ $.Values.clusterDomain }}:{{ $.Values.service.port }} resolve;
        {{- end }}
        keepalive 64;
      }
      server {
        listen {{ .Values.gateway.service.port }};
        client_max_body_size 17m;
        location ~ ^/(internal/|metrics$|v1/status) { return 404; }
        location = /v1/subscriptions/stream {
          proxy_pass {{ include "spruce.scheme" . }}://streams;
          proxy_http_version 1.1;
          proxy_set_header Connection "";
          proxy_buffering off;
          proxy_connect_timeout 250ms;
          proxy_read_timeout 1h;
        }
        location ~ ^/v1/topics/[A-Za-z0-9._-]+/(messages|batches)$ {
          proxy_pass {{ include "spruce.scheme" . }}://topic_publishes;
          proxy_http_version 1.1;
          proxy_set_header Connection "";
          proxy_buffering off;
          proxy_connect_timeout 250ms;
          proxy_read_timeout 1h;
          proxy_next_upstream error timeout http_502 http_503 http_504;
          proxy_next_upstream_tries 3;
        }
        location / {
          proxy_pass {{ include "spruce.scheme" . }}://brokers;
          proxy_http_version 1.1;
          proxy_set_header Connection "";
          proxy_buffering off;
          proxy_connect_timeout 250ms;
          proxy_read_timeout 1h;
          proxy_next_upstream error timeout http_502 http_503 http_504;
          proxy_next_upstream_tries 3;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "spruce.fullname" . }}-gateway
  labels:
    {{- include "spruce.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.gateway.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "spruce.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        {{- include "spruce.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: gateway
      annotations:
        checksum/config: {{ printf "%s:%s:%d:%d" .Chart.Version (toJson .Values.gateway) (int .Values.replicaCount) (int .Values.service.port) | sha256sum }}
        {{- if .Values.tls.enabled }}
        checksum/tls: {{ include "spruce.tlsChecksum" . }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.gateway.terminationGracePeriodSeconds }}
      {{- if .Values.gateway.topologySpreadConstraints }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "spruce.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: gateway
      {{- end }}
      securityContext: {runAsNonRoot: true, fsGroup: 101, fsGroupChangePolicy: OnRootMismatch, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: nginx
          image: "{{ .Values.gateway.image.repository }}{{ if .Values.gateway.image.digest }}@{{ .Values.gateway.image.digest }}{{ else }}:{{ .Values.gateway.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          ports:
            - {name: http, containerPort: {{ .Values.gateway.service.port }}}
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
          livenessProbe:
            tcpSocket: {port: http}
          resources: {{ toYaml .Values.gateway.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 101
            runAsGroup: 101
            capabilities: {drop: [ALL]}
          lifecycle:
            preStop:
              exec: {command: [sh, -c, "kill -QUIT 1; sleep 5"]}
          volumeMounts:
            - {name: config, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf, readOnly: true}
            - {name: cache, mountPath: /var/cache/nginx}
            - {name: run, mountPath: /var/run}
            {{- if .Values.tls.enabled }}
            - {name: tls, mountPath: /tls, readOnly: true}
            {{- end }}
      volumes:
        - name: config
          configMap: {name: {{ include "spruce.fullname" . }}-gateway}
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
        {{- if .Values.tls.enabled }}
        - name: tls
          secret:
            secretName: {{ required "tls.existingSecret is required when TLS is enabled" .Values.tls.existingSecret }}
            defaultMode: 0440
        {{- end }}
{{- end }}
