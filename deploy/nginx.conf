events { worker_connections 4096; }
http {
  resolver ${SPRUCE_DNS_RESOLVER} valid=1s ipv6=off;
  access_log off;
  map $http_spruce_producer_id $spruce_has_producer { "" 0; default 1; }
  map $http_spruce_idempotency_key $spruce_has_operation { "" 0; default 1; }
  map "$spruce_has_producer:$spruce_has_operation:$uri" $spruce_retryable_publish {
    default 0;
    ~^1:1:/v1/topics/[A-Za-z0-9._-]+/messages$ 1;
  }
  map $http_spruce_delivery_affinity $scoped_completion { "" 0; default 1; }
  map $arg_topic $legacy_stream_key {
    "" "$remote_addr:$remote_port:$connection";
    default "$arg_topic:$arg_group";
  }
  map $http_spruce_delivery_affinity $stream_key {
    "" $legacy_stream_key;
    default $http_spruce_delivery_affinity;
  }
  map $uri $publish_key {
    ~^/v1/topics/(?<publish_topic>[A-Za-z0-9._-]+)/(messages|batches)$ $publish_topic;
    default "$uri";
  }
  upstream spruce_publish { zone publish_peers 64k; hash $publish_key consistent; server broker1:8080 resolve fail_timeout=1s; server broker2:8080 resolve fail_timeout=1s; server broker3:8080 resolve fail_timeout=1s; keepalive 64; }
  upstream spruce { zone action_peers 64k; least_conn; server broker1:8080 resolve fail_timeout=1s; server broker2:8080 resolve fail_timeout=1s; server broker3:8080 resolve fail_timeout=1s; keepalive 64; }
  upstream spruce_stream { zone stream_peers 64k; hash $stream_key consistent; server broker1:8080 resolve fail_timeout=1s; server broker2:8080 resolve fail_timeout=1s; server broker3:8080 resolve fail_timeout=1s; }
  server {
    listen 8080;
    client_max_body_size 17m;
    location ~ ^/(internal/|metrics$|v1/status) { return 404; }
    location ~ ^/v1/topics/[A-Za-z0-9._-]+/(messages|batches)$ {
      error_page 418 = @retryable_publish;
      if ($spruce_retryable_publish) { return 418; }
      proxy_pass http://spruce_publish;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_connect_timeout 250ms;
      proxy_read_timeout 1h;
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 3;
    }
    location @retryable_publish {
      proxy_pass http://spruce_publish;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_connect_timeout 250ms;
      proxy_read_timeout 1h;
      proxy_next_upstream error timeout http_502 http_503 http_504 non_idempotent;
      proxy_next_upstream_tries 3;
    }
    location = /v1/subscriptions/stream {
      proxy_pass http://spruce_stream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_connect_timeout 250ms;
      proxy_read_timeout 30s;
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 3;
    }
    location ~ ^/v1/deliveries/(ack|nack)$ {
      error_page 418 = @scoped_completion;
      if ($scoped_completion) { return 418; }
      proxy_pass http://spruce;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_connect_timeout 250ms;
    }
    location @scoped_completion {
      proxy_pass http://spruce_stream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_connect_timeout 250ms;
    }
    location / {
      proxy_pass http://spruce;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_connect_timeout 250ms;
      proxy_read_timeout 1h;
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 3;
    }
  }
}
