events { worker_connections 4096; }
http {
  access_log off;
  map $arg_group $stream_key {
    "" "$remote_addr:$remote_port:$connection";
    default "$arg_topic:$arg_group";
  }
  upstream spruce { least_conn; server broker1:8080; server broker2:8080; server broker3:8080; keepalive 64; }
  upstream spruce_stream { hash $stream_key consistent; server broker1:8080; server broker2:8080; server broker3:8080; }
  server {
    listen 8080;
    client_max_body_size 17m;
    location = /v1/subscriptions/stream {
      proxy_pass http://spruce_stream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_connect_timeout 250ms;
      proxy_read_timeout 1h;
    }
    location / {
      proxy_pass http://spruce;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_connect_timeout 250ms;
      proxy_read_timeout 1h;
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 3;
    }
  }
}
