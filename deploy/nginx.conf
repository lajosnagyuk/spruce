events { worker_connections 4096; }
http {
  resolver ${SPRUCE_DNS_RESOLVER} valid=1s ipv6=off;
  access_log off;
  map $arg_topic $stream_key {
    "" "$remote_addr:$remote_port:$connection";
    default "$arg_topic";
  }
  map $uri $publish_key {
    ~^/v1/topics/(?<publish_topic>[A-Za-z0-9._-]+)/(messages|batches)$ $publish_topic;
    default "$uri";
  }
  upstream spruce_publish { zone publish_peers 64k; hash $publish_key consistent; server broker1:8080 resolve; server broker2:8080 resolve; server broker3:8080 resolve; keepalive 64; }
  upstream spruce { zone action_peers 64k; least_conn; server broker1:8080 resolve; server broker2:8080 resolve; server broker3:8080 resolve; keepalive 64; }
  upstream spruce_stream { zone stream_peers 64k; hash $stream_key consistent; server broker1:8080 resolve; server broker2:8080 resolve; server broker3:8080 resolve; }
  server {
    listen 8080;
    client_max_body_size 17m;
    location ~ ^/(internal/|metrics$|v1/status) { return 404; }
    location ~ ^/v1/topics/[A-Za-z0-9._-]+/(messages|batches)$ {
      proxy_pass http://spruce_publish;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_connect_timeout 250ms;
      proxy_read_timeout 1h;
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 3;
    }
    location = /v1/subscriptions/stream {
      proxy_pass http://spruce_stream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_connect_timeout 250ms;
      proxy_read_timeout 1h;
    }
    location / {
      proxy_pass http://spruce;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_connect_timeout 250ms;
      proxy_read_timeout 1h;
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 3;
    }
  }
}
