name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
jobs:
  integration:
    uses: ./.github/workflows/kubernetes.yaml
    permissions:
      contents: read
  helm:
    needs: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4
      - run: |
          version="${GITHUB_REF_NAME#v}"
          helm lint deploy/helm/spruce --set image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa --set tls.allowInsecureTransport=true --set gateway.allowInsecureClientTransport=true
          helm package deploy/helm/spruce --version "$version" --app-version "$version" --destination artifacts
          echo "$GITHUB_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push "artifacts/spruce-$version.tgz" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: {name: helm-chart, path: 'artifacts/*.tgz'}
  image:
    needs: integration
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=/tmp/spruce.oci.tar
          provenance: mode=max
          sbom: true
      - run: |
          mkdir -p /tmp/spruce-oci
          tar -xf /tmp/spruce.oci.tar -C /tmp/spruce-oci
      - uses: aquasecurity/trivy-action@2736533278103862a861f4a35ebac3e97854d956
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          input: /tmp/spruce-oci
          severity: CRITICAL,HIGH
          exit-code: '1'
      - uses: aquasecurity/trivy-action@2736533278103862a861f4a35ebac3e97854d956
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          input: /tmp/spruce-oci
          severity: CRITICAL,HIGH
          exit-code: '1'
      - run: sudo apt-get update && sudo apt-get install -y skopeo
      - run: |
          version="${GITHUB_REF_NAME#v}"
          skopeo copy --all oci-archive:/tmp/spruce.oci.tar "docker://ghcr.io/${GITHUB_REPOSITORY}:$version"
          digest=$(skopeo inspect --format '{{.Digest}}' "docker://ghcr.io/${GITHUB_REPOSITORY}:$version")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
        id: digest
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ghcr.io/${{ github.repository }}@${{ steps.digest.outputs.digest }}
          format: spdx-json
          output-file: spruce.spdx.json
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - run: cosign sign --yes ghcr.io/${{ github.repository }}@${{ steps.digest.outputs.digest }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supply-chain
          path: |
            spruce.spdx.json
  csharp:
    needs: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with: {dotnet-version: '8.0.x'}
      - run: dotnet run --project clients/csharp/Spruce.Conformance/Spruce.Conformance.csproj
      - run: dotnet run --project clients/csharp/Spruce.BatcherConformance/Spruce.BatcherConformance.csproj
      - run: |
          version="${GITHUB_REF_NAME#v}"
          dotnet pack clients/csharp/Spruce/Spruce.csproj -c Release -p:PackageVersion="$version" -o artifacts
          dotnet nuget push 'artifacts/*.nupkg' --source "https://nuget.pkg.github.com/${GITHUB_REPOSITORY_OWNER}/index.json" --api-key "$GITHUB_TOKEN" --skip-duplicate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: {name: csharp-client, path: 'artifacts/*.nupkg'}
  python:
    needs: integration
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.11'}
      - run: |
          python -m pip install ./clients/python build
          PYTHONPATH=clients/python/src python -m unittest discover -s clients/python/tests -p 'test_*.py' -v
          version="${GITHUB_REF_NAME#v}"
          sed -i "s/__version__ = \"[^\"]*\"/__version__ = \"$version\"/" clients/python/src/spruce/__init__.py
          python -m build --outdir artifacts clients/python
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: {name: python-client, path: artifacts/*}
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        if: vars.PUBLISH_PYPI == 'true'
        with: {packages-dir: artifacts}
