name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version: '1.26.x'}
      - run: go test ./...
      - run: go test -race ./...
      - run: make perf-test
      - run: CGO_ENABLED=0 go build -trimpath ./cmd/spruce
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with: {dotnet-version: '8.0.x'}
      - run: dotnet run --project clients/csharp/Spruce.Conformance/Spruce.Conformance.csproj
      - run: dotnet run --project clients/csharp/Spruce.BatcherConformance/Spruce.BatcherConformance.csproj
      - run: dotnet pack clients/csharp/Spruce/Spruce.csproj -c Release -o artifacts
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.11'}
      - name: Install Python client and build dependencies
        run: python -m pip install ./clients/python build
      - run: PYTHONPATH=clients/python/src python -m unittest discover -s clients/python/tests -p 'test_*.py' -v
      - run: python -m build --outdir artifacts clients/python
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4
      - run: make helm-test
      - name: Verify gateway publish retry boundaries
        run: |
          python3 scripts/test-gateway-retry.py --engine docker
          python3 scripts/test-gateway-retry.py --engine docker --helm
      - run: helm lint deploy/helm/spruce --set image.repository=spruce --set image.tag=ci --set image.pullPolicy=Never --set tls.allowInsecureTransport=true --set gateway.allowInsecureClientTransport=true
      - run: |
          for replicas in 1 2 3; do
            max_unavailable=1; test "$replicas" -gt 1 || max_unavailable=0
          helm template spruce deploy/helm/spruce --set image.repository=spruce --set image.tag=ci --set image.pullPolicy=Never --set replicaCount=$replicas --set podDisruptionBudget.maxUnavailable=$max_unavailable --set tls.allowInsecureTransport=true --set gateway.allowInsecureClientTransport=true >/dev/null
          done
      - run: helm template spruce deploy/helm/spruce --set image.repository=spruce --set image.tag=ci --set image.pullPolicy=Never --set tls.enabled=true --set tls.existingSecret=spruce-tls --set ingress.enabled=true --set ingress.tls[0].secretName=public-tls --set ingress.tls[0].hosts[0]=spruce.example.com >/dev/null
