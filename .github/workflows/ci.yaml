name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - run: go test ./...
      - run: go test -race ./...
      - run: CGO_ENABLED=0 go build -trimpath ./cmd/spruce

  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project clients/csharp/Spruce.Conformance/Spruce.Conformance.csproj
      - run: dotnet pack clients/csharp/Spruce/Spruce.csproj -c Release -o artifacts

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/spruce
      - run: helm template spruce deploy/helm/spruce --set replicaCount=1 >/dev/null
      - run: helm template spruce deploy/helm/spruce --set replicaCount=3 --set tls.enabled=true --set tls.existingSecret=spruce-tls >/dev/null
